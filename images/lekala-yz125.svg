<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="t d">
  <title id="t">Лекала наклеек для Yamaha YZ125</title>
  <desc id="d">Детали кита: боковина, боковая панель, заднее и переднее крыло, номерная табличка, защита вилки и маятник, с линиями реза.</desc>
  <defs>
    <pattern id="grid-s" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#D3DDE8" stroke-width="0.6"/>
    </pattern>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#grid-s)"/>
      <path d="M50 0H0V50" fill="none" stroke="#B9C8D8" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <path d="M0 0V7" stroke="#22303F" stroke-width="2"/>
    </pattern>
    <!-- Линия реза: контур детали, раздутый на вылет -->
    <filter id="cut" filterUnits="userSpaceOnUse" x="-30" y="-30" width="360" height="260">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="outer"/>
      <feMorphology in="SourceAlpha" operator="dilate" radius="5.3" result="inner"/>
      <feComposite in="outer" in2="inner" operator="out" result="ring"/>
      <feFlood flood-color="#E5007E"/>
      <feComposite in2="ring" operator="in" result="cutline"/>
      <feMerge><feMergeNode in="cutline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" fill="#F2F5F8"/>
  <rect width="600" height="600" fill="url(#grid)"/>

  <g font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="12" fill="#22303F">

    <!-- Боковина радиатора: широкая передняя часть закрывает радиатор, хвост уходит назад вдоль бака к сиденью -->
    <g transform="translate(30 42)" filter="url(#cut)">
      <path d="M12 30 L118 8 Q128 6 138 10 L282 40 Q292 43 288 51 L284 56 L176 78 Q148 84 138 104 L116 178 Q112 192 98 190 L44 178 Q20 172 16 150 L3 52 Q1 34 12 30 Z"
            fill="#FFFFFF" stroke="#22303F" stroke-width="2" stroke-linejoin="round"/>
      <path d="M24 150 L64 60 L98 54 L52 160 Z" fill="#22303F"/>
      <path d="M72 162 L108 70 L250 46 L262 50 L150 74 Q132 80 124 98 L104 170 Z" fill="url(#hatch)" opacity="0.5"/>
      <g fill="#F2F5F8" stroke="#22303F" stroke-width="1.5">
        <circle cx="30" cy="48" r="5"/><circle cx="196" cy="54" r="5"/><circle cx="96" cy="176" r="5"/>
      </g>
    </g>
    <text x="70" y="256">боковина ×2</text>

    <!-- Боковая панель (фильтр) с полем под номер -->
    <g transform="translate(346 52)" filter="url(#cut)">
      <path d="M6 12 Q6 2 18 2 L186 -4 Q202 -4 199 12 L178 98 Q174 110 160 110 L30 116 Q8 118 7 98 Z"
            fill="#FFFFFF" stroke="#22303F" stroke-width="2" stroke-linejoin="round"/>
      <path d="M30 22 L150 18 Q160 18 158 28 L146 86 Q144 94 136 94 L36 98 Q26 98 26 88 Z"
            fill="none" stroke="#22303F" stroke-width="1" stroke-dasharray="3 3"/>
      <path d="M166 10 L190 8 L168 104 L150 106 Z" fill="#22303F"/>
      <g fill="#F2F5F8" stroke="#22303F" stroke-width="1.5">
        <circle cx="20" cy="16" r="4.5"/><circle cx="20" cy="102" r="4.5"/>
      </g>
      <text x="86" y="64" font-size="11" text-anchor="middle" fill="#22303F">поле номера</text>
    </g>
    <text x="400" y="196">боковая панель ×2</text>

    <!-- Заднее крыло -->
    <g transform="translate(340 218) scale(0.86)" filter="url(#cut)">
      <path d="M2 64 Q0 48 16 44 L120 26 L250 4 Q268 2 266 14 L262 24 L134 50 Q100 58 88 76 L76 92 Q70 100 58 98 L12 88 Q2 84 2 72 Z"
            fill="#FFFFFF" stroke="#22303F" stroke-width="2.3" stroke-linejoin="round"/>
      <path d="M20 80 L60 46 L180 24 L196 26 L80 52 L48 86 Z" fill="url(#hatch)" opacity="0.5"/>
    </g>
    <text x="410" y="322">заднее крыло ×2</text>

    <!-- Переднее крыло -->
    <g transform="translate(340 346)" filter="url(#cut)">
      <path d="M2 36 Q36 6 116 6 L228 12 Q246 14 244 28 Q240 40 224 40 L110 38 Q50 38 8 46 Q-4 46 2 36 Z"
            fill="#FFFFFF" stroke="#22303F" stroke-width="2" stroke-linejoin="round"/>
      <path d="M40 34 Q70 18 120 16 L200 18 L196 26 L120 26 Q80 28 56 36 Z" fill="#22303F"/>
    </g>
    <text x="410" y="414">переднее крыло ×2</text>

    <!-- Маятник -->
    <g transform="translate(344 436)" filter="url(#cut)">
      <path d="M4 2 L210 12 Q222 13 220 24 L218 30 Q216 36 206 36 L4 30 Q-2 30 -1 22 L0 8 Q0 2 4 2 Z"
            fill="#FFFFFF" stroke="#22303F" stroke-width="2" stroke-linejoin="round"/>
      <path d="M150 10 L180 12 L168 34 L138 32 Z" fill="#22303F"/>
      <path d="M190 14 L204 14 L194 34 L180 34 Z" fill="#22303F"/>
    </g>
    <text x="410" y="490">маятник ×2</text>

    <!-- Передняя номерная табличка -->
    <g transform="translate(44 290)" filter="url(#cut)">
      <path d="M12 2 L150 2 Q164 2 162 16 L152 118 Q148 148 122 166 L92 184 Q80 192 68 184 L38 166 Q12 148 8 118 L-2 16 Q-4 2 12 2 Z"
            fill="#FFFFFF" stroke="#22303F" stroke-width="2" stroke-linejoin="round"/>
      <path d="M22 18 L138 18 L130 112 L30 112 Z" fill="none" stroke="#22303F" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="80" y="88" font-size="52" font-weight="bold" text-anchor="middle" fill="none" stroke="#22303F" stroke-width="1.8">125</text>
      <path d="M40 140 L80 120 L120 140 L80 172 Z" fill="url(#hatch)" opacity="0.55"/>
    </g>
    <text x="86" y="504">номер</text>

    <!-- Защита вилки -->
    <g transform="translate(230 290)" filter="url(#cut)">
      <path d="M6 0 L34 4 Q40 5 40 12 L36 168 Q35 180 24 182 L12 184 Q2 184 2 174 L0 8 Q0 0 6 0 Z"
            fill="#FFFFFF" stroke="#22303F" stroke-width="2" stroke-linejoin="round"/>
      <path d="M4 120 L38 98 L37 120 L4 142 Z" fill="#22303F"/>
    </g>
    <g transform="translate(286 290) scale(-1 1) translate(-40 0)" filter="url(#cut)">
      <path d="M6 0 L34 4 Q40 5 40 12 L36 168 Q35 180 24 182 L12 184 Q2 184 2 174 L0 8 Q0 0 6 0 Z"
            fill="#FFFFFF" stroke="#22303F" stroke-width="2" stroke-linejoin="round"/>
      <path d="M4 120 L38 98 L37 120 L4 142 Z" fill="#22303F"/>
    </g>
    <text x="216" y="504">защита вилки</text>

    <!-- Штамп -->
    <g transform="translate(330 504)" stroke="#22303F" stroke-width="1.6" font-style="normal">
      <rect width="240" height="70" fill="#FFFFFF"/>
      <path d="M0 30 H240 M150 30 V70 M0 50 H240"/>
      <text x="12" y="22" font-size="15" font-weight="bold" stroke="none">Yamaha YZ125 · кит</text>
      <text x="12" y="44" font-size="11" stroke="none">SMGRAPHICS</text>
      <text x="162" y="44" font-size="11" stroke="none">2022+</text>
      <text x="12" y="64" font-size="11" stroke="none">рез: плоттер</text>
      <text x="162" y="64" font-size="11" stroke="none">лист 1</text>
    </g>

    <!-- Легенда -->
    <g transform="translate(40 534)" font-style="normal" font-size="11">
      <path d="M0 6 H32" stroke="#E5007E" stroke-width="1.4"/>
      <text x="42" y="10" stroke="none">линия реза (вылет)</text>
      <path d="M0 26 H32" stroke="#22303F" stroke-width="2"/>
      <text x="42" y="30" stroke="none">край детали</text>
    </g>
  </g>
</svg>
